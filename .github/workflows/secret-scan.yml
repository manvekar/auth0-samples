name: Secret Scan

on:
  push:
    branches: [ master, main, feature/*, bugfix/* ]
  pull_request:
    branches: [ master, main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for TruffleHog

      - name: Set up Docker
        run: |
          docker version

      - name: TruffleHog Scan (Verified Secrets)
        id: trufflehog
        continue-on-error: true
        run: |
          echo "🔍 Running TruffleHog with verification..."
          docker run --rm -v $(pwd):/work trufflesecurity/trufflehog:latest \
            git --fail --results=verified \
            2>&1 | tee trufflehog-results.txt

      - name: Process TruffleHog Results
        if: steps.trufflehog.outcome == 'failure'
        run: |
          echo "❌ Verified secrets found! Failing workflow."
          echo "Review trufflehog-results.txt for details."
          echo "::error::TruffleHog detected verified active secrets that must be rotated immediately."
          exit 1

      - name: Install Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks-linux-amd64
          chmod +x gitleaks-linux-amd64
          sudo mv gitleaks-linux-amd64 /usr/local/bin/gitleaks

      - name: Gitleaks Scan
        id: gitleaks
        continue-on-error: true
        run: |
          echo "🔍 Running Gitleaks..."
          gitleaks detect --source . --report-path gitleaks.sarif --report-format sarif

      - name: Gitleaks Results
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "❌ Potential secrets found by Gitleaks. Review gitleaks.sarif"
          echo "::error::Gitleaks detected potential secrets. See SARIF report."
          exit 1

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: secret-scanning

      - name: Success
        if: success()
        run: |
          echo "✅ No secrets detected. All scans passed."
